<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f5f5f3; --surface:#ffffff; --ink:#18181a; --muted:#6b6b70; --line:#e2e2df;
  --accent:#2f5d50; --accent-soft:#e3ece9;
  --ok:#2f7d4f; --ok-soft:#e2f1e7; --warn:#a86a00; --warn-soft:#fbf0d9; --bad:#b3261e; --bad-soft:#fbe4e2; --na:#9a9a9f;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121213; --surface:#1c1c1e; --ink:#ececea; --muted:#9d9da3; --line:#2e2e31;
  --accent:#7fb8a6; --accent-soft:#1f2e2a;
  --ok:#6cc48f; --ok-soft:#18291f; --warn:#e2a93c; --warn-soft:#2e2412; --bad:#f08279; --bad-soft:#341a18; --na:#6d6d72; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 56px;display:grid;gap:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:13px}
.hint{font-size:13px;color:var(--muted)}
button{font-family:inherit}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
input[type=date],input[type=text],select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface);color:var(--ink)}
input[type=date]{font-family:var(--f-num);font-size:13px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.back{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 0}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.done{background:var(--accent-soft);color:var(--accent)} .pill.cancel{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
/* list */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.staffsel{display:flex;gap:8px;align-items:center;font-size:14px}
.staffsel select{font-size:15px;padding:6px 10px}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.dl{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;color:inherit;font-size:inherit}
.drow:hover{border-color:var(--muted)}
.drow b{font-size:16px}
.drow .meta{grid-column:1/-1;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.bar{display:inline-flex;align-items:center;gap:6px}
.bar i{display:block;width:60px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i u{display:block;height:100%;background:var(--accent)}
/* detail */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:16px}
.dhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:80px;height:80px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring .bgc{stroke:var(--line)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{fill:var(--ink);font-family:var(--f-num);font-size:15px;font-weight:600}
.dmeta{display:grid;gap:4px;min-width:0;flex:1}
.dmeta h2{margin:0;font-size:22px}
.facts{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.facts label{display:flex;gap:6px;align-items:center;white-space:nowrap}
.facts input{width:min(12em,52vw)}
.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.date{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;align-content:start}
.date>span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.date label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.date small{font-size:11px;color:var(--muted)}
.mode{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:3px;justify-self:start;flex-wrap:wrap}
.mode button{border:0;background:none;padding:6px 14px;border-radius:6px;font-size:14px;color:var(--muted);cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.alert{border-radius:8px;padding:10px 14px;font-size:14px}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.ok{background:var(--ok-soft);color:var(--ok)} .alert.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.stepper{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.st{flex:1 0 auto;min-width:72px;display:grid;gap:4px;font-size:11px;color:var(--muted);text-align:center;background:none;border:0;cursor:pointer;padding:0}
.st i{display:block;height:6px;border-radius:3px;background:var(--line)}
.st.done i{background:var(--accent)} .st.cur i{background:linear-gradient(90deg,var(--accent) var(--p),var(--line) var(--p))}
.st.cur{color:var(--ink);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;font-size:14px;color:var(--muted);padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:500}
details.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden}
details.ph+details.ph{margin-top:8px}
details.ph summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:var(--bg)}
details.ph summary::-webkit-details-marker{display:none}
details.ph summary .t{font-weight:700;flex:1}
.allbtn{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:99px;padding:3px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.resetbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:3px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.resetbtn:hover{border-color:var(--bad);color:var(--bad)}
.resetbtn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.allbtn:hover{background:var(--accent-soft)}
.allbtn.armed{background:var(--accent);color:#fff}
details.ph summary .c{font-size:12px;color:var(--muted)}
details.ph summary::after{content:"▾";color:var(--muted)}
details.ph:not([open]) summary::after{transform:rotate(-90deg)}
ul.items{list-style:none;margin:0;padding:0 14px}
.it{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.chk{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;display:grid;place-items:center;color:transparent;font-weight:700;padding:0}
.chk.done{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.na{background:var(--bg);color:var(--na);border-style:dashed}
.chk.busy{opacity:.5}
.lbl{display:grid;min-width:0;padding-top:3px}
.lbl b{font-weight:500;line-height:1.45}
.lbl small{font-size:12px;color:var(--muted)}
.it.na .lbl b{color:var(--na);text-decoration:line-through}
.it.sub .lbl b::before{content:"↪ ";color:var(--muted)}
.stamp{font-size:12px;color:var(--ok);padding-top:6px;white-space:nowrap;text-align:right}
.it.na .stamp{color:var(--na)}
.it.key{background:var(--warn-soft);border:2px solid var(--warn);border-radius:10px;padding:10px 12px;margin:8px 0}
.it.key .chk{border:2px solid var(--warn)}
.it.key .chk.done{background:var(--warn);border-color:var(--warn)}
.it.key .lbl b{font-weight:700}
.date small.warn{color:var(--bad);font-weight:500}
input[type=datetime-local]{font-family:var(--f-num);font-size:13px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface);color:var(--ink)}
.date input[type=text]{width:9em}
.callout{padding:10px 12px;margin:8px 0;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:14px;display:grid}
.callout small{font-weight:400;font-size:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 14px;font-size:14px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.hk{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.hk+.hk{margin-top:8px}
.hk header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hk label.row{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.hk input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.notes{display:grid;gap:12px}
.note{border-left:2px solid var(--line);padding:2px 0 2px 14px}
.note .when{font-size:12px;color:var(--muted)}
.note p{margin:4px 0 0;max-width:62ch;white-space:pre-wrap}
.memo{display:grid;gap:8px}
.memo textarea{min-height:64px;resize:vertical}
.cancelbox{border:1px solid var(--bad);border-radius:10px;padding:14px;display:grid;gap:10px}
/* ランキング */
.rank{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.rank-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rank-h span{font-size:13px;color:var(--muted)}
.rank ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rank li{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;padding:6px 8px;border-radius:8px}
.rank li:first-child{background:var(--warn-soft)}
.rank li.me{outline:2px solid var(--accent)}
.rank .md{font-size:18px;text-align:center}
.rank .ct{font-size:18px;font-weight:600}
.rank .ct small{font-size:11px;margin-left:2px;color:var(--muted)}
/* 一覧カード */
.drow.st-bad{border-left:5px solid var(--bad)}
.drow.st-ready{border:2px solid var(--warn);background:var(--warn-soft)}
.drow.st-done{opacity:.75}
.dots{grid-column:1/-1;display:flex;gap:4px}
.dots i{display:block;flex:1;max-width:36px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.now{background:var(--warn);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
/* 次はこれ（小さめ） */
.next{border:1.5px solid var(--accent);border-radius:10px;padding:6px 10px;display:grid;gap:4px;background:var(--accent-soft)}
.next-h{font-weight:700;font-size:12px;color:var(--accent);letter-spacing:.05em}
.next-it{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center;background:var(--surface);border-radius:6px;padding:4px 8px}
.next-it .chk{width:22px;height:22px;border-radius:5px;font-size:12px}
.next-it .lbl{padding-top:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.next-it .lbl b{font-size:13px}
.next-it.key{outline:2px solid var(--warn)}
.next-it small{font-size:11px;color:var(--muted)}
/* すぐ書けるメモ（次はこれ！の上） */
.qmemo{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start}
.qmemo textarea{min-height:40px;height:40px;resize:vertical}
.qmemo .btn{padding:8px 14px}
.qmemo-last{grid-column:1/-1;font-size:13px;color:var(--muted);white-space:pre-wrap;border-left:2px solid var(--accent);padding-left:8px}
.qmemo-last b{color:var(--ink);font-weight:500}
/* 一覧カードのメモ */
.drow .memo1{grid-column:1/-1;font-size:13px;color:var(--ink);background:var(--bg);border-radius:6px;padding:4px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .memo1 small{color:var(--muted);margin-left:6px}
/* 鍵渡しの予定 */
.keyev{display:grid;gap:4px}
.keyev .btn{font-size:13px;padding:6px 10px;justify-self:start}
.keyev small{font-size:11px;color:var(--muted)}
.keyev small.ok{color:var(--ok)}
/* 完了ボタン */
.ready{position:sticky;top:8px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 16px;border-radius:14px;color:#fff;background:linear-gradient(120deg,#2f5d50,#3f8f6f);box-shadow:0 8px 24px rgba(47,93,80,.35);animation:rise .55s cubic-bezier(.2,1.3,.4,1)}
.ready b{display:block;font-size:17px}
.ready span{font-size:13px;opacity:.9}
.btn-complete{border:0;border-radius:99px;padding:12px 26px;font-size:17px;font-weight:700;background:#fff;color:#2f5d50;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15);animation:glow 1.6s ease-in-out infinite}
.btn-complete:disabled{opacity:.6;animation:none}
@keyframes rise{from{transform:translateY(40px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,255,255,.35)}}
/* 段階クリア */
details.ph.clear summary{background:linear-gradient(90deg,#f6e7b8,#fbf3da);color:#6b4e00}
.badge{font-size:11px;font-weight:700;letter-spacing:.12em;color:#fff;background:#c99a1a;border-radius:4px;padding:2px 8px}
details.ph.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(201,154,26,.8)}100%{box-shadow:0 0 0 14px rgba(201,154,26,0)}}
/* 紙吹雪 */
.confetti{position:fixed;inset:0;z-index:20;pointer-events:auto;overflow:hidden;display:grid;place-items:center}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation-name:fall;animation-timing-function:cubic-bezier(.3,.6,.6,1);animation-fill-mode:forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.cf-msg{background:var(--surface);color:var(--ink);border:2px solid var(--accent);border-radius:16px;padding:18px 28px;font-size:22px;font-weight:700;box-shadow:0 10px 40px rgba(0,0,0,.2);animation:rise .5s cubic-bezier(.2,1.3,.4,1)}
@media (prefers-reduced-motion:reduce){.ready,.btn-complete,.dots i.now,details.ph.flash,.cf-msg{animation:none}}
.pill.ready{background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:9}
.loading{padding:40px;text-align:center;color:var(--muted)}
/* A4 表紙 */
.printwrap{overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px}
.paper{width:794px;min-height:1123px;margin:0 auto;background:#fff;color:#111;padding:36px 40px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:10.5px;line-height:1.3;color-scheme:light}
.paper h3{margin:0 0 8px;text-align:center;font-size:17px;letter-spacing:.3em}
.paper table{border-collapse:collapse;width:100%}
.paper td,.paper th{border:1px solid #444;padding:2.5px 5px;vertical-align:middle}
.paper .hd td{padding:4px 6px;font-size:11px}
.paper .hd td.k{background:#eee;width:15%;font-weight:700}
.paper .ck{width:20px;text-align:center;font-size:12px}
.paper .dt{width:44px;text-align:center;font-family:var(--f-num);font-size:9.5px}
.paper .ph{width:62px;text-align:center;font-weight:700;background:#f4f4f4;font-size:10px}
.paper tr.key td{background:#fff1cc;font-weight:700;border-top:2px solid #b07400;border-bottom:2px solid #b07400}
.paper tr.na td.tx{color:#888;text-decoration:line-through}
.paper .nt{font-size:9.5px;color:#555}
.paper .foot{margin-top:6px;display:flex;justify-content:space-between;font-size:9.5px;color:#555}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  .printwrap{border:0;padding:0;overflow:visible;background:#fff}
  .paper{box-shadow:none;margin:0;width:718px;min-height:0;padding:0}
  .wrap{padding:0;display:block;max-width:none}
  @page{size:A4 portrait;margin:10mm}
}
@media (max-width:560px){.card{padding:14px}.it{grid-template-columns:34px 1fr}.stamp{grid-column:2;text-align:left;padding-top:0}}

<body>
<div class="wrap" id="root"><div class="loading">読み込み中…</div></div>

<script>
const START_ID = <?!= JSON.stringify(dealId) ?>;
const PRINT_MODE = <?!= JSON.stringify(printMode) ?>;
const APP_URL = <?!= JSON.stringify(appUrl) ?>;

const MODES = [["対面","対面契約"],["郵送","郵送契約"],["電子","電子契約"]];
const LIST_OF = {"対面":"対面・郵送","郵送":"対面・郵送","電子":"電子"};
const MAIL_ONLY = "郵送契約のみ";
const FUTAI = ["愛の引越し","大阪ガス・電気","インターネット","ウォーターサーバー","火災保険"];
const CANCEL_REASONS = ["審査落ち","お客様都合","他社で決定","条件が合わなかった","その他"];
const STALL_HOURS = 48;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => { if (!s) return ""; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (+m[2]) + "/" + (+m[3]) : ""; };
const mdhm = s => { const m = String(s).match(/T(\d{2}:\d{2})/); return md(s) + (m ? " " + m[1] : ""); };
const nowIso = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };

function call(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(err => { toast("保存できませんでした：" + (err && err.message || err)); reject(err); })[fn](...args);
  });
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ===== 状態 =====
let LIST = null, scope = "mine", showClosed = false;
let qmemoDraft = ""; // 書きかけのメモ（チェックで画面を描き直しても消えないように）
let D = null, tab = "check", openSet = new Set(), cancelOpen = false, busy = new Set(), armed = -1, armTimer = null, flashPhase = -1, armedReset = -1;

function phasesOf(mode) {
  const list = LIST_OF[mode] || "対面・郵送";
  const out = [];
  D.items.filter(i => i.list === list && (i.phase !== MAIL_ONLY || mode === "郵送")).forEach(i => {
    let p = out.find(x => x.name === i.phase);
    if (!p) { p = { name: i.phase, items: [] }; out.push(p); }
    p.items.push(i);
  });
  return out;
}
function hikiSections() {
  const out = [];
  D.items.filter(i => i.list === "引き継ぎ").forEach(i => {
    let p = out.find(x => x.name === i.phase);
    if (!p) { p = { name: i.phase, items: [] }; out.push(p); }
    if (i.kind !== "期日のみ") p.items.push(i);
  });
  return out;
}
const checkOf = id => D.checks.find(c => c.item === id);

function bindCard(PH) {
  const d = D.deal, id = d["案件ID"], root = $("root");
  $("back").onclick = () => loadList();
  root.querySelectorAll("button.chk[data-item]").forEach(b => b.onclick = async () => {
    const itemId = b.dataset.item; if (busy.has(itemId)) return;
    const c = checkOf(itemId), v = c ? c.v : "", next = v === "" ? "done" : ""; // 押すと ✓、もう一度押すと外れる（前の ✕ も押すと外れる）
    const pi0 = PH.findIndex(p => p.items.some(i => i.id === itemId));
    const wasClear = (() => { const x = phaseStat(PH[pi0]); return x.tot && x.done === x.tot; })();
    const prev = D.checks.slice();
    D.checks = D.checks.filter(x => x.item !== itemId);
    if (next) D.checks.push({ item: itemId, v: next, at: nowIso(), by: D.me.name });
    setDeal({ "最終活動": nowIso() });
    openSet.add(pi0);
    const nowClear = (() => { const x = phaseStat(PH[pi0]); return x.tot && x.done === x.tot; })();
    if (!wasClear && nowClear) celebratePhase(pi0, PH);
    busy.add(itemId); renderCard();
    try { const r = await call("apiCheck", id, itemId, next); const x = checkOf(itemId); if (x) { x.at = r.at; x.by = r.by; } setDeal({ "状態": r.status }); }
    catch (e) { D.checks = prev; }
    busy.delete(itemId); renderCard();
  });
  root.querySelectorAll("[data-all]").forEach(b => b.onclick = async ev => {
    ev.preventDefault(); ev.stopPropagation();
    const pi = +b.dataset.all;
    if (armed !== pi) {
      armed = pi; clearTimeout(armTimer);
      armTimer = setTimeout(() => { armed = -1; renderCard(); }, 4000);
      renderCard(); return;
    }
    armed = -1; clearTimeout(armTimer);
    const ids = PH[pi].items.filter(i => i.kind !== "注意" && !checkOf(i.id)).map(i => i.id);
    if (!ids.length) return;
    const prev = D.checks.slice();
    ids.forEach(itemId => D.checks.push({ item: itemId, v: "done", at: nowIso(), by: D.me.name }));
    setDeal({ "最終活動": nowIso() }); openSet.add(pi); celebratePhase(pi, PH); ids.forEach(x => busy.add(x)); renderCard();
    try {
      const r = await call("apiCheckMany", id, ids);
      D.checks.forEach(c => { if (r.added.includes(c.item)) { c.at = r.at; c.by = r.by; } });
      setDeal({ "状態": r.status }); toast(r.added.length + "件をチェックしました");
    } catch (e) { D.checks = prev; }
    ids.forEach(x => busy.delete(x)); renderCard();
  });
  root.querySelectorAll("[data-reset]").forEach(b => b.onclick = async ev => {
    ev.preventDefault(); ev.stopPropagation();
    const pi = +b.dataset.reset;
    if (armedReset !== pi) {
      armedReset = pi; clearTimeout(armTimer);
      armTimer = setTimeout(() => { armedReset = -1; renderCard(); }, 4000);
      renderCard(); return;
    }
    armedReset = -1; clearTimeout(armTimer);
    const ids = PH[pi].items.filter(i => checkOf(i.id)).map(i => i.id);
    if (!ids.length) return;
    const prev = D.checks.slice();
    D.checks = D.checks.filter(c => !ids.includes(c.item));
    if (D.deal["状態"] === "完了") setDeal({ "状態": "進行中" });
    openSet.add(pi); renderCard();
    try { const r = await call("apiResetMany", id, ids); setDeal({ "状態": r.status }); toast("「" + PH[pi].name + "」をリセットしました"); }
    catch (e) { D.checks = prev; renderCard(); }
  });
  root.querySelectorAll("details.ph").forEach(el => el.addEventListener("toggle", () => { const pi = +el.dataset.pi; el.open ? openSet.add(pi) : openSet.delete(pi); }));
  root.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { tab = "check"; openSet.add(+b.dataset.jump); renderCard(); const el = root.querySelector(`details[data-pi="${b.dataset.jump}"]`); el && el.scrollIntoView({ behavior: "smooth", block: "start" }); });
  root.querySelectorAll("[data-mode]").forEach(b => b.onclick = async () => {
    const prev = d["契約方法"]; setDeal({ "契約方法": b.dataset.mode }); openSet = new Set([stat().cur]); renderCard();
    try { await call("apiField", id, "契約方法", b.dataset.mode); } catch (e) { setDeal({ "契約方法": prev }); renderCard(); }
  });
  root.querySelectorAll("[data-field]").forEach(inp => inp.onchange = async () => {
    const f = inp.dataset.field, prev = d[f]; setDeal({ [f]: inp.value });
    try { await call("apiField", id, f, inp.value); toast("保存しました"); if (f === "重説完了日" || f === "宅建士" || f === "入居日") renderCard(); } catch (e) { setDeal({ [f]: prev }); renderCard(); }
  });
  root.querySelectorAll("[data-futai]").forEach(b => b.onclick = async () => {
    const on = String(d["付帯"] || "").split(",").filter(Boolean), f = b.dataset.futai;
    const next = on.includes(f) ? on.filter(x => x !== f) : on.concat(f);
    const prev = d["付帯"]; setDeal({ "付帯": next.join(",") }); renderCard();
    try { await call("apiField", id, "付帯", next.join(",")); } catch (e) { setDeal({ "付帯": prev }); renderCard(); }
  });
  root.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; renderCard(); });
  root.querySelectorAll("[data-hiki]").forEach(inp => inp.onchange = async () => {
    const key = inp.dataset.hiki, val = inp.type === "checkbox" ? (inp.checked ? "1" : "") : inp.value;
    D.hiki[key] = val;
    try { await call("apiHiki", id, key, val); } catch (e) { renderCard(); }
  });
  const am = $("addMemo"); if (am) am.onclick = async () => {
    const t = $("memo").value.trim(); if (!t) return;
    am.disabled = true;
    try { const n = await call("apiNote", id, t); D.notes.unshift(n); setDeal({ "最終活動": n.at }); renderCard(); } catch (e) { am.disabled = false; }
  };
  const qm = $("qmemo"); if (qm) qm.oninput = () => { qmemoDraft = qm.value; };
  const qs = $("qmemoSave"); if (qs) qs.onclick = async () => {
    const t = $("qmemo").value.trim(); if (!t) return;
    qs.disabled = true;
    try { const n = await call("apiNote", id, t); qmemoDraft = ""; D.notes.unshift(n); setDeal({ "最終活動": n.at }); renderCard(); toast("メモを保存しました"); } catch (e) { qs.disabled = false; }
  };
  const ke = $("keyEv"); if (ke) ke.onclick = async () => {
    ke.disabled = true; ke.textContent = "カレンダーに入れています…";
    try { const r = await call("apiKeyEvents", id); D.hiki.keyEvents = r.value; renderCard(); toast("鍵渡しの予定を入れました（" + r.where + "）"); }
    catch (e) { renderCard(); }
  };
  const cpl = $("completeBtn"); if (cpl) cpl.onclick = async () => {
    cpl.disabled = true; cpl.textContent = "保存中…";
    try { D.deal = await call("apiComplete", id); renderCard(); confetti("完了！お疲れさまでした"); }
    catch (e) { cpl.disabled = false; cpl.textContent = "完了にする"; }
  };
  const cb = $("cancelBtn"); if (cb) cb.onclick = () => { cancelOpen = true; renderCard(); };
  const cn = $("cancelNo"); if (cn) cn.onclick = () => { cancelOpen = false; renderCard(); };
  const co = $("cancelOk"); if (co) co.onclick = async () => {
    co.disabled = true;
    try { D.deal = await call("apiCancel", id, $("c-reason").value, $("c-detail").value.trim()); cancelOpen = false; renderCard(); } catch (e) { co.disabled = false; }
  };
  const uc = $("uncancel"); if (uc) uc.onclick = async () => { try { D.deal = await call("apiUncancel", id); renderCard(); } catch (e) {} };
}

// ===== 演出 =====
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
// 段階を全部埋めたら：見出しを光らせ、たたんで次の段階を開く
function celebratePhase(pi, PH) {
  flashPhase = pi;
  openSet.delete(pi);
  const next = PH.findIndex((p, i) => i > pi && (() => { const x = phaseStat(p); return x.done < x.tot; })());
  if (next >= 0) openSet.add(next);
  toast("「" + PH[pi].name + "」クリア！");
  setTimeout(() => { flashPhase = -1; }, 1600);
}
function confetti(msg) {
  const box = document.createElement("div"); box.className = "confetti";
  box.innerHTML = `<div class="cf-msg">${esc(msg)}</div>`;
  if (!REDUCED) {
    const colors = ["#2f5d50", "#e2a93c", "#b3261e", "#4a86e8", "#ff9900", "#9b59b6", "#2f7d4f"];
    for (let i = 0; i < 90; i++) {
      const p = document.createElement("i");
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = Math.random() * 0.6 + "s";
      p.style.animationDuration = 1.8 + Math.random() * 1.4 + "s";
      p.style.transform = "rotate(" + Math.random() * 360 + "deg)";
      box.appendChild(p);
    }
  }
  document.body.appendChild(box);
  box.onclick = () => box.remove();
  setTimeout(() => box.remove(), 3400);
}

// ===== A4 表紙 =====
function renderPaper(autoPrint) {
  const d = D.deal, mode = d["契約方法"];
  const rows = phasesOf(mode).map(p => p.items.map((i, ii) => {
    const ph = ii === 0 ? `<td class="ph" rowspan="${p.items.length}">${esc(p.name)}</td>` : "";
    if (i.kind === "注意") return `<tr><td class="ck">⚠</td><td class="tx"><b>${esc(i.text)}</b>${i.note ? ` <span class="nt">※${esc(i.note)}</span>` : ""}</td><td class="dt"></td>${ph}</tr>`;
    const c = checkOf(i.id), v = c ? c.v : "";
    return `<tr class="${v === "na" ? "na" : ""} ${i.kind === "重要" ? "key" : ""}"><td class="ck">${v === "done" ? "☑" : v === "na" ? "✕" : "☐"}</td><td class="tx">${i.kind === "続き" ? "↪ " : ""}${esc(i.text)}${i.note ? ` <span class="nt">※${esc(i.note)}</span>` : ""}</td><td class="dt">${v === "done" ? md(c.at) : ""}</td>${ph}</tr>`;
  }).join("")).join("");
  const modeName = (MODES.find(m => m[0] === mode) || [, ""])[1];
  $("root").innerHTML = `
    <div class="topbar noprint"><span class="hint">今チェックが入っている状態で、A4縦1枚に出力します。</span><button class="btn primary" id="doPrint">印刷する</button></div>
    <div class="printwrap"><div class="paper">
      <h3>契約業務チェックシート${mode === "電子" ? "（電子契約）" : ""}</h3>
      <table class="hd">
        <tr><td class="k">物件名</td><td>${esc(d["物件"])}</td><td class="k">重説予定日</td><td class="num">${md(d["重説予定日"])}</td></tr>
        <tr><td class="k">氏名</td><td>${esc(d["お客様名"])} 様</td><td class="k">重説完了日</td><td class="num">${md(d["重説完了日"])}</td></tr>
        <tr><td class="k">管理会社</td><td>${esc(d["管理会社"])}</td><td class="k">宅建士名</td><td>${esc(d["宅建士"])}</td></tr>
        <tr><td class="k">TEL</td><td class="num">${esc(d["TEL"])}</td><td class="k">入居日</td><td class="num">${md(d["入居日"])}</td></tr>
        <tr><td class="k">契約方法</td><td>${modeName}</td><td class="k">鍵渡し予定日時</td><td class="num">${d["鍵渡し予定日時"] ? mdhm(d["鍵渡し予定日時"]) : ""}</td></tr>
      </table>
      <table style="margin-top:8px"><thead><tr><th class="ck"></th><th>項目</th><th class="dt">実施日</th><th class="ph">段階</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="foot"><span>☑ 完了　✕ 該当なし</span><span>担当 ${esc(d["担当"])}　出力日 ${md(nowIso())}　株式会社Monochro</span></div>
    </div></div>`;
  $("doPrint").onclick = printPaper;
  if (autoPrint) setTimeout(printPaper, 600);
}

// A4縦（余白10mm）の印刷範囲 718×1047px に収まるよう縮小してから印刷する
function fitPaper() {
  const p = document.querySelector(".paper"); if (!p) return;
  p.style.zoom = ""; const w = p.style.width, pad = p.style.padding, mh = p.style.minHeight;
  p.style.width = "718px"; p.style.padding = "0"; p.style.minHeight = "0";
  const h = p.scrollHeight;
  p.style.width = w; p.style.padding = pad; p.style.minHeight = mh;
  p.dataset.zoom = String(Math.min(1, 1000 / h));
}
function printPaper() { fitPaper(); window.print(); }
window.addEventListener("beforeprint", () => { fitPaper(); const p = document.querySelector(".paper"); if (p) p.style.zoom = p.dataset.zoom; });
window.addEventListener("afterprint", () => { const p = document.querySelector(".paper"); if (p) p.style.zoom = ""; });

if (START_ID) openDeal(START_ID); else loadList();
</script>
